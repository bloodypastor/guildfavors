<style>
:root{
  --ink:#07060a;
  --panel:#12101a;
  --panel-2:#1a1724;
  --frame:#6b4b2a;
  --frame-hi:#a3764a;
  --gold:#e0b34c;
  --gold-dim:#8d7233;
  --paper:#d8d2c4;
  --muted:#8b8498;
  --dungeon:#ef4f34;
  --ocean:#5f97e0;
  --wild:#8aae4e;
  --global:#3fd8c8;
  --town:#9090ee;
  --ok:#6fcf6f;
  --warn:#e0904c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink);
  background-image:radial-gradient(circle at 20% -10%, #1b1626 0%, #07060a 60%);
  color:var(--paper);
  font-family:'Google Sans','Google Sans Text','Product Sans',Roboto,system-ui,sans-serif;
  font-size:16px;
  line-height:1.5;
  padding:18px;
}
.px{font-family:'Silkscreen','Courier New',monospace;letter-spacing:.02em}
a{color:var(--gold)}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---- wooden gump frame ---- */
.gump{
  max-width:1220px;margin:0 auto;
  border:6px solid transparent;
  border-radius:4px;
  background:
    linear-gradient(var(--panel),var(--panel)) padding-box,
    linear-gradient(160deg,var(--frame-hi),var(--frame) 30%,#3d2916 70%,var(--frame-hi)) border-box;
  box-shadow:0 0 0 1px #000, 0 18px 50px rgba(0,0,0,.7);
}
.gump-inner{border:1px solid #000;background:var(--panel)}

header.top{
  display:flex;flex-wrap:wrap;gap:16px;align-items:baseline;justify-content:space-between;
  padding:14px 16px;border-bottom:1px solid #2c2438;
  background:linear-gradient(#1d1828,#141021);
}
h1{margin:0;font-family:'Silkscreen',monospace;font-size:17px;color:var(--gold);font-weight:700}
.head-right{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stamp{font-size:13px;color:var(--muted)}
.btn.head-btn{width:auto;margin:0;padding:7px 12px}
.stamp b{color:var(--paper);font-weight:600}

/* ---- layout ---- */
.body{display:grid;grid-template-columns:262px 1fr;min-height:60vh}
aside{border-right:1px solid #2c2438;background:#100e18;padding:14px 12px;display:flex;flex-direction:column;gap:18px}
main{padding:14px 16px;min-width:0}

.block > h2{
  margin:0 0 8px;font-family:'Silkscreen',monospace;font-size:12px;
  color:var(--gold);font-weight:400;
}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}

/* ---- slot planner ---- */
.slots{display:flex;flex-direction:column;gap:6px}
.slot{
  display:flex;gap:8px;align-items:center;min-height:46px;padding:6px 8px;
  border:1px dashed #3a3150;border-radius:3px;background:#15121f;font-size:13px;
}
.slot.filled{border:1px solid var(--gold-dim);background:#1d1828}
.slot .empty{color:#554d6b;font-family:'Silkscreen',monospace;font-size:11px}
.slot img{width:26px;height:26px;image-rendering:pixelated;flex:none}
.slot .txt{flex:1;min-width:0;line-height:1.25}
.slot .txt .loc{font-family:'Silkscreen',monospace;font-size:11px;display:block}
.slot .txt .val{font-family:'Silkscreen',monospace;font-size:11px;color:var(--paper)}
.slot .drop{background:none;border:0;color:#7c7391;font-size:16px;line-height:1;padding:2px 4px}
.slot .drop:hover{color:var(--dungeon)}

.btn{
  display:block;width:100%;padding:9px 10px;margin-top:8px;
  background:linear-gradient(#2a2238,#1b1626);
  border:1px solid var(--gold-dim);border-radius:3px;
  font-family:'Silkscreen',monospace;font-size:11px;color:var(--gold);
}
.btn:hover{border-color:var(--gold);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{border-color:#3a3150;color:var(--muted)}

/* ---- weekly ---- */
.weekly-row{display:flex;gap:6px;align-items:center;margin-bottom:5px;font-size:10px;min-height:3.9em}
.weekly-row label{flex:1;color:var(--muted);display:flex;align-items:center;gap:6px;line-height:1.3}
img.wk{width:18px;height:18px;object-fit:contain;image-rendering:pixelated;vertical-align:-4px;flex:none}
.row img.wk{margin-left:5px}
th img.wk{width:20px;height:20px;margin:2px 1px 0}
select,input[type=text]{
  background:#0c0a12;color:var(--paper);border:1px solid #3a3150;border-radius:2px;
  padding:5px 6px;font-family:inherit;font-size:13px;max-width:130px;
}
input[type=text]{max-width:none;width:100%}

/* ---- filter bar ---- */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters select{max-width:none}
.count{margin-left:auto;font-family:'Silkscreen',monospace;font-size:11px;color:var(--muted)}

/* ---- group + rows ---- */
.group{margin-bottom:18px}
.group > h3{
  display:flex;align-items:center;gap:8px;margin:0 0 6px;
  font-family:'Silkscreen',monospace;font-size:12px;font-weight:400;
  padding-bottom:5px;border-bottom:1px solid #251f33;
}
.group > h3 .n{margin-left:auto;color:var(--muted);font-size:11px}

.row{
  display:flex;gap:10px;align-items:center;
  padding:7px 8px;border-bottom:1px solid #1c1727;
}
.row:hover{background:#171322}
.row.dead{opacity:.42}
.row.stacked{background:linear-gradient(90deg,rgba(224,179,76,.13),transparent 55%)}
.row img{width:34px;height:34px;object-fit:contain;image-rendering:pixelated;flex:none}
.row .main{flex:1;min-width:0}
.row .loc{font-family:'Silkscreen',monospace;font-size:12px}
.row .val{font-family:'Silkscreen',monospace;font-size:12.5px;color:#fff}
.row .note{font-size:12px;color:var(--warn)}
.pips{display:flex;gap:2px;flex:none}
.pip{width:7px;height:7px;border:1px solid #4a4160;background:transparent}
.pip.on{background:var(--gold);border-color:var(--gold)}
.qty{font-family:'Silkscreen',monospace;font-size:12px;color:var(--gold);flex:none;min-width:34px;text-align:right}
.add{
  flex:none;border:1px solid #3a3150;background:#181425;border-radius:2px;
  font-family:'Silkscreen',monospace;font-size:10px;padding:6px 8px;color:var(--muted);
}
.add:hover{border-color:var(--gold);color:var(--gold)}

/* ---- week planner ---- */
.week{padding:12px 16px 14px;border-bottom:1px solid #2c2438;background:#110f19}
.week-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.week-head h2{margin:0;font-family:'Silkscreen',monospace;font-size:12px;color:var(--gold);font-weight:400}
.week-head .hint{margin:0;flex:1;min-width:200px}
.week-head .btn{width:auto;margin:0;padding:7px 12px}
.week-scroll{overflow-x:auto}
.week-grid{display:grid;grid-template-columns:repeat(7,minmax(148px,1fr));gap:6px}
.day{display:flex;flex-direction:column;gap:4px;padding:5px;border:1px solid #251f33;border-radius:3px;background:#14111d}
.day.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold-dim) inset}
.day-h{display:flex;align-items:center;gap:6px;background:none;border:0;padding:2px 3px;
  font-family:'Silkscreen',monospace;font-size:11px;color:var(--muted);text-align:left}
.day.sel .day-h{color:var(--gold)}
.day-h .n{margin-left:auto;font-size:10px}
.day-h .today{font-size:9px;color:var(--ink);background:var(--ok);padding:0 4px;border-radius:2px}
.cellp{display:flex;gap:6px;align-items:center;height:52px;padding:4px 6px;
  border:1px dashed #3a3150;border-radius:3px;background:#15121f;font-size:12px}
button.cellp{width:100%;color:#554d6b;font-family:'Silkscreen',monospace;font-size:10px;justify-content:center;cursor:pointer}
button.cellp:not(.filled):hover{border-color:var(--gold-dim);color:var(--gold)}
.cellp.filled{border:1px solid var(--gold-dim);background:#1d1828}
button.cellp.filled{color:inherit;font-family:inherit;font-size:inherit;justify-content:flex-start;text-align:left}
button.cellp.filled:hover{border-color:var(--dungeon);background:#241925}
.cellp img{width:18px;height:auto;image-rendering:pixelated;flex:none}
.cellp .txt{flex:1;min-width:0;line-height:1.2}
.cellp .loc{display:block;font-family:'Silkscreen',monospace;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cellp .val{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11px;line-height:1.2;color:var(--paper)}

/* ---- society jobs ---- */
.soc-row{display:flex;gap:6px;align-items:center;margin-bottom:4px;font-size:13px}
.soc-row label{flex:1;font-family:'Silkscreen',monospace;font-size:10.5px;display:flex;align-items:center;gap:4px;min-width:0}
.soc-row input{width:74px;max-width:74px;text-align:right;font-family:'Silkscreen',monospace;font-size:11px}
.soc{display:inline-block;font-family:'Silkscreen',monospace;font-size:9.5px;line-height:1.3;color:#f3e7a6;
  border:1px solid var(--gold-dim);background:#231c12;padding:0 3px;border-radius:2px;margin-left:5px;vertical-align:1px;white-space:nowrap}
th .soc{margin:3px 1px 0}
.qty small{display:block;font-size:9.5px;color:var(--ok)}

/* ---- matrix ---- */
.matrix-wrap{overflow:auto;max-height:70vh;border:1px solid #251f33}
table{border-collapse:collapse;font-size:12px;width:100%}
th,td{border:1px solid #221c2f;padding:4px 6px;text-align:center;white-space:nowrap}
th{position:sticky;top:0;background:#1a1626;font-family:'Silkscreen',monospace;font-size:10px;font-weight:400;z-index:2}
td.rowhead,th.rowhead{position:sticky;left:0;background:#16121f;text-align:left;font-family:'Silkscreen',monospace;font-size:10.5px;z-index:1}
th.rowhead{z-index:3}
td.has{color:#fff}
td.cell{cursor:pointer}
td.odd .b{color:var(--warn)}
td.cell:hover{background:#241d33;outline:1px solid var(--gold)}
td.cell.dead{opacity:.4}
td.empty{color:#3d3552}
td .b{color:var(--gold);font-family:'Silkscreen',monospace;font-size:10.5px}

/* ---- states ---- */
.state{padding:40px 16px;text-align:center;color:var(--muted)}
.state h2{font-family:'Silkscreen',monospace;font-size:14px;color:var(--gold)}
.state code{background:#0c0a12;padding:2px 5px;border:1px solid #2c2438;font-size:12px;word-break:break-all}
textarea{width:100%;min-height:120px;background:#0c0a12;color:var(--paper);border:1px solid #3a3150;padding:8px;font-family:monospace;font-size:12px}

footer.bottom{
  display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;
  padding:10px 16px;border-top:1px solid #2c2438;background:#141021;
  font-family:'Silkscreen',monospace;font-size:10.5px;color:var(--muted);
}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:#1d1828;border:1px solid var(--gold);color:var(--gold);
  padding:9px 16px;border-radius:3px;font-family:'Silkscreen',monospace;font-size:11px;
  opacity:0;pointer-events:none;transition:opacity .18s
}
.toast.show{opacity:1}

@media (max-width:900px){
  body{padding:8px}
  .body{grid-template-columns:1fr}
  aside{border-right:0;border-bottom:1px solid #2c2438;order:2}
  main{order:1}
  .row{flex-wrap:wrap}
  .row .main{flex-basis:60%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const SOCMAP = Object.fromEntries(SOCIETY_LOCS.map(s=>[s.loc,s]));
/* "25", "25k", "25000", "25,000" → 25000 */
function parseGold(v){
  const t = String(v||'').toLowerCase().replace(/[\s,_]/g,'');
  if(!t) return 0;
  const n = parseFloat(t.replace(/k$/,''));
  if(!isFinite(n) || n<=0) return 0;
  return Math.round((/k$/.test(t) || n<1000) ? n*1000 : n);
}
const fmtK = g => (g%1000 ? (g/1000).toFixed(1) : g/1000) + 'k';
function societyBadge(loc){

  return g ? `<span class="soc" title="Society job: kill ${g.toLocaleString('en-US')} gold worth of creatures">${fmtK(g)}</span>` : '';

  {id:'wed',ua:'Wednesday'},{id:'thu',ua:'Thursday'},{id:'fri',ua:'Friday'}];
const TODAY = (new Date().getDay()+1)%7;   /* JS: 0=Sun … 6=Sat → 0=Sat */

/* starting values for the board — edit when the week rolls over, e.g. {sanct:'Pulma'} */

/* ---------- state ---------- */
let FAVORS = [];      // {type,value,sign,location,count,tier}

let RAW_SAMPLE = null;

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TIERNAME = ['Common','Uncommon','Rare'];

function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1900);
}
function parseCSV(text){
  const rows=[]; let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=c;
    } else if(c==='"') q=true;
    else if(c===','){ row.push(cell); cell=''; }
    else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else if(c!=='\r') cell+=c;
  }
  if(cell||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(v=>v.trim()!==''));
}
/* exact match against the wiki table; otherwise closest, flagged as inexact */
function tierOf(t, num){
  if(!t) return {tier:0, exact:false};
  const hit = t.tiers.findIndex(v=>Math.abs(v-num)<0.01);
  if(hit>=0) return {tier:hit, exact:true};
  let best=0, d=1e9;
  t.tiers.forEach((v,i)=>{ const dd=Math.abs(v-num); if(dd<d){d=dd;best=i;} });
  return {tier:best, exact:false};
}

/* ---------- loading ---------- */
async function load(){
  $('#main').innerHTML = '<div class="state" id="state"><h2>Loading the vault…</h2></div>';
  loadStamp();

/* last-updated date: meta sheet, cell A1, given as DD.MM.YYYY.
   Rendered as "Sep 20, 2026" so it reads the same for US and EU folks;
   falls back to the raw sheet text if it isn't that format. */
const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtStampDate(s){
  const m = String(s).trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if(!m) return s;
  const d = +m[1], mo = +m[2];
  if(mo<1 || mo>12 || d<1 || d>31) return s;
  return `${MONTHS_SHORT[mo-1]} ${d}, ${m[3]}`;
}
async function loadStamp(){
  try{
    const rows = await fetchRows(META_TAB, 'A1');
    const flat = rows.flat().map(v=>String(v).trim()).filter(Boolean);
    if(flat.length){ STAMP = fmtStampDate(flat[0]); $('#stamp-date').textContent = STAMP; }
  }catch(e){ /* keep the DATA_DATE fallback value */ }
}

/* try plain CSV first, then JSONP — the latter works around CORS
   and also works when the page is opened as a local file */
async function fetchRows(tab, range){
  let q = '&headers=1' + (tab ? '&sheet='+encodeURIComponent(tab) : '');
  if(range) q += '&range='+encodeURIComponent(range);
  const csvUrls = [
    ...(PUB_CSV_URL && !tab ? [PUB_CSV_URL] : []),
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv${q}`,
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv${q}`
  ];
  for(const url of csvUrls){
    try{
      const r = await fetch(url, {cache:'no-store'});
      if(!r.ok) continue;
      const txt = await r.text();
      if(/<html/i.test(txt)) continue;
      const rows = parseCSV(txt);
      if(rows.length) return rows;
    }catch(e){ /* CORS or network error — try the next method */ }
  }
  return loadJsonp(q);
}

function loadJsonp(q){
  return new Promise((resolve,reject)=>{
    const cb = '__gviz_'+Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const timer = setTimeout(()=>{ cleanup(); reject(new Error('Google did not respond')); }, 12000);
    function cleanup(){ clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = res=>{
      cleanup();
      if(!res || res.status==='error') return reject(new Error('the sheet is not shared publicly'));
      const cols = (res.table.cols||[]).map(c=>(c.label||'').toString().trim());
      const rows = (res.table.rows||[]).map(r=>(r.c||[]).map(c=>{
        if(!c) return '';
        if(c.f != null) return String(c.f);
        if(c.v != null) return String(c.v);
        return '';
      }));
      resolve([cols, ...rows]);
    };
    s.onerror = ()=>{ cleanup(); reject(new Error('could not reach Google Sheets')); };
    s.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:${cb}${q}`;
    document.head.appendChild(s);
  });
}
function failState(msg){
  $('#main').innerHTML = `
    <div class="state">
      <h2>Data did not load</h2>
      <p>${esc(msg)}.</p>
      <p>Two things to check: the sheet must be shared (File → Share → Anyone with the link → Viewer),
         and this page should be opened over http, not as a local file — browsers block sheet requests
         from <code>file://</code> pages.</p>
      <p><code>${esc(SHEET_ID)}</code></p>
      <p>Or paste the CSV here:</p>
      <textarea id="paste" placeholder="bonus_type,bonus_value,location&#10;Gold Loot,+20.0%,Nusero"></textarea>
      <button class="btn" style="max-width:280px;margin:10px auto" id="use-paste">Use pasted data</button>
    </div>`;
  $('#use-paste').onclick = ()=>{ try{ ingest($('#paste').value); }catch(e){ toast('Could not parse that CSV'); } };
}
function ingest(txt){
  const rows = parseCSV(txt);
  if(!rows.length) throw new Error('the sheet is empty');
  ingestRows(rows);
}
function ingestRows(rows){
  if(!rows || !rows.length) throw new Error('the sheet is empty');
  const head = rows[0].map(h=>String(h).trim().toLowerCase());
  const iT = head.indexOf('bonus_type'), iV = head.indexOf('bonus_value'), iL = head.indexOf('location');
  const body = (iT<0) ? rows : rows.slice(1);
  const c = {t:iT<0?0:iT, v:iV<0?1:iV, l:iL<0?2:iL};
  RAW_SAMPLE = {head, idx:c, rows:body.slice(0,4)};
  const numish = v => /^[+-]?\s*\d+([.,]\d+)?\s*%?$/.test(String(v).trim());
  const agg = new Map();
  for(const r of body){
    const type=(r[c.t]||'').trim(), loc=(r[c.l]||'').trim();
    if(!type||!loc) continue;
    let val=(r[c.v]||'').trim();
    /* the value column can be empty (a Sheets cell-format quirk) —
       in that case look for a number in any other column of the row */
    if(!val){
      for(let i=0;i<r.length;i++){
        if(i===c.t || i===c.l) continue;
        const cand=String(r[i]||'').trim();
        if(cand && numish(cand)){ val=cand; break; }
      }
    }
    const k = type+'|'+val+'|'+loc;
    agg.set(k,(agg.get(k)||0)+1);
  }
  FAVORS = [...agg.entries()].map(([k,count])=>{
    const [type,raw,location] = k.split('|');
    const t = TMAP[type];
    const base = Math.abs(parseFloat(String(raw).replace('%','').replace(',','.')))||0;
    /* Sheets returns percentages at different scales depending on cell format:
       20, 0.2, or 2000 — pick whichever matches the wiki tier exactly */
    let num = base, res = tierOf(t, base);
    if(!res.exact){
      for(const cand of [base*100, base/100]){
        const r = tierOf(t, cand);
        if(r.exact){ num = cand; res = r; break; }
      }
    }
    const neg = t ? !!t.neg : String(raw).trim().startsWith('-');
    const value = num ? (neg?'-':'+') + num.toFixed(1) + '%' : String(raw||'?');
    return {type,value,location,count,num,tier:res.tier,exact:res.exact&&!!num,
            raw:String(raw),meta:t,sign:neg?-1:1};
  });
  render();
}

/* ---------- sidebar ---------- */

const favKey = f => f.type+'|'+f.value+'|'+f.location;
function plannedCount(k){ return WEEK.reduce((n,d)=>n+d.filter(p=>favKey(p)===k).length,0); }
function planTotal(){ return WEEK.reduce((n,d)=>n+d.length,0); }

function renderWeek(){
  $('#week').innerHTML = DAYS.map((d,di)=>{
    const plan = WEEK[di];
    const cells = [0,1,2].map(i=>{
      const p = plan[i];
      if(!p) return `<button class="cellp" data-day="${di}" title="Add favors to ${d.ua}">empty</button>`;
      const cat = LOCCAT[p.location]||'dungeon';
      const t = p.meta ? p.meta.ua : p.type;
      return `<button class="cellp filled" data-day="${di}" data-i="${i}" title="${esc(p.location)} — ${esc(p.type)} ${esc(p.value)} (${TIERNAME[p.tier]}) · click to remove">
        <img src="${ICONS[p.meta?p.meta.icon:'slayer']||''}" alt="">
        <span class="txt">
          <span class="loc" style="color:${CATCOLOR[cat]}">${esc(p.location)}</span>
          <span class="val">${esc(p.value)} ${esc(t)}</span>
        </span>
      </button>`;
    }).join('');
    return `<div class="day${di===SEL_DAY?' sel':''}">
      <button class="day-h" data-day="${di}" title="Add favors to ${d.ua}">${d.ua}
        ${di===TODAY?'<span class="today">today</span>':''}<span class="n">${plan.length}/3</span></button>
      ${cells}
    </div>`;
  }).join('');
  const n = planTotal();
  $('#plan-count').textContent = n ? `${n} planned · adding to ${DAYS[SEL_DAY].ua}` : `adding to ${DAYS[SEL_DAY].ua}`;
  $('#copy-plan').disabled = !n;
  $('#week').querySelectorAll('.day-h, button.cellp:not(.filled)').forEach(b=>{
    b.onclick = ()=>{ SEL_DAY = +b.dataset.day; renderWeek(); };
  });
  $('#week').querySelectorAll('button.cellp.filled').forEach(b=>{
    b.onclick = ()=>{ WEEK[+b.dataset.day].splice(+b.dataset.i,1); saveHash(); render(); };
  });
}
function addToPlan(f){
  const day = WEEK[SEL_DAY], dn = DAYS[SEL_DAY].ua;
  const blk = blockedBy(f.location);
  if(blk) return toast(`${blk} — favors cannot be activated there`);
  if(day.length>=3) return toast(`All three slots on ${dn} are taken`);
  if(day.some(p=>p.type===f.type && p.location===f.location)) return toast(`That favor is already planned for this region on ${dn}`);
  if(f.count && plannedCount(favKey(f))>=f.count) return toast(`All ×${f.count} of these are already planned`);
  day.push(f); saveHash(); render(); toast(`Added to ${dn}`);
}
function copyPlan(){
  const blocks = DAYS.map((d,di)=>{
    if(!WEEK[di].length) return null;
    const lines = WEEK[di].map((p,i)=>`  ${i+1}. ${p.location} — ${p.type} ${p.value} (${TIERNAME[p.tier]})`);
    return `**${d.ua}**\n${lines.join('\n')}`;
  }).filter(Boolean);
  const txt = `Requesting favor activation:\n${blocks.join('\n')}\n${location.href}`;
  navigator.clipboard?.writeText(txt).then(()=>toast('Copied')).catch(()=>fallbackCopy(txt));
}
function fallbackCopy(txt){
  const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
  ta.select(); document.execCommand('copy'); ta.remove(); toast('Copied');
}

/* ---------- state in URL ---------- */
let writingHash = false;
function saveHash(){
  const p=new URLSearchParams();
  Object.entries(WEEKLY).forEach(([k,v])=>{ if(v) p.set('w.'+k,locCode(v)); });
  SOCIETY_LOCS.forEach(x=>{ if(JOBS[x.loc]) p.set('j.'+(LOC2CODE[x.loc]||x.id), JOBS[x.loc]/1000); });
  DAYS.forEach((d,di)=>WEEK[di].forEach((f,i)=>p.set(d.id+i, `${typeCode(f.type)}-${locCode(f.location)}-${f.num!=null?f.num:''}`)));
  writingHash = true;
  location.replace('#'+p.toString());
  setTimeout(()=>{ writingHash = false; }, 0);
}
function loadHash(){
  WEEKLY = Object.assign({}, DEFAULT_WEEKLY);
  WEEK = DAYS.map(()=>[]);
  JOBS = {};
  const dayIdx = Object.fromEntries(DAYS.map((d,i)=>[d.id,i]));
  const p=new URLSearchParams(location.hash.slice(1));
  for(const [k,v] of p){
    if(k.startsWith('w.')) { WEEKLY[k.slice(2)]=codeLoc(v); continue; }
    if(k.startsWith('j.')){
      const id = k.slice(2);
      const x = SOCIETY_LOCS.find(s=>s.id===id || LOC2CODE[s.loc]===id), g = parseGold(v);
      if(x && g) JOBS[x.loc]=g;
      continue;
    }
    /* sat0…fri2; old links using p0…p2 fall on Saturday */
    const m = k.match(/^([a-z]{3}|p)(\d)$/);
    if(!m) continue;
    const di = m[1]==='p' ? 0 : dayIdx[m[1]];
    if(di==null) continue;
    /* "gold-ak-25" — type code (may itself contain hyphens), region code, plain number.
       Old links used "type~value~region" (with a %-encoded value) — still read those too. */
    let type, value, loc;
    if(v.includes('~')){
      const [tc,val,lc]=v.split('~');
      type = codeType(tc); value = val; loc = codeLoc(lc||'');
    } else {
      const parts = v.split('-');
      if(parts.length<3) continue;
      const num = parts.pop(), lc = parts.pop();
      type = codeType(parts.join('-')); loc = codeLoc(lc);
      const meta = TMAP[type], n = parseFloat(num);
      value = isFinite(n) ? (meta&&meta.neg?'-':'+') + n.toFixed(1) + '%' : '';
    }
    if(!type||!loc) continue;
    if(WEEK[di].length<3)
      WEEK[di].push({type,value,location:loc,meta:TMAP[type],
                     tier:tierOf(TMAP[type], Math.abs(parseFloat(value))||0).tier});
  }
}
/* the address bar also drives the page: editing the hash by hand or
   opening someone else's link applies the week and plan immediately */
window.addEventListener('hashchange', ()=>{
  if(writingHash) return;
  loadHash();
  renderSociety();
  render();
});

/* ---------- filters + list ---------- */
function visible(opts){
  const useLocType = !(opts && opts.rarityOnly);
  return FAVORS.filter(f=>{
    if(F.loc && useLocType){
      if(F.loc==='__towns') { if(LOCCAT[f.location]!=='town') return false; }
      else if(f.location!==F.loc && f.location!=='Everywhere') return false;
    }
    if(F.type && useLocType && f.type!==F.type) return false;
    if(F.tier!=='' && String(f.tier)!==F.tier) return false;
    if(F.q){
      const hay=(f.type+' '+f.location+' '+(f.meta?f.meta.ua:'')).toLowerCase();
      if(!hay.includes(F.q.toLowerCase())) return false;
    }
    return true;
  });
}
/* weekly Sanctuary and Challenger dungeons block favor activation */
function blockedBy(loc){
  if(WEEKLY.sanct && loc===WEEKLY.sanct) return 'Sanctuary';
  if(WEEKLY.chall && loc===WEEKLY.chall) return 'Challenger';
  return '';
}
function stacksWith(f){
  if(!f.meta || !f.meta.weekly) return false;
  return WEEKLY[f.meta.weekly] && WEEKLY[f.meta.weekly]===f.location;
}
function renderMain(){
  const list = visible(showMatrix ? {rarityOnly:true} : null);
  const total = FAVORS.reduce((s,f)=>s+f.count,0);
  const shown = list.reduce((s,f)=>s+f.count,0);

  const locOpts = ['<option value="">All locations</option>',
    '<optgroup label="Dungeons">'+DUNGEONS.map(l=>`<option${F.loc===l?' selected':''}>${l}</option>`).join('')+'</optgroup>',
    '<optgroup label="Other">'+['Ocean','Wilderness','Everywhere'].map(l=>`<option${F.loc===l?' selected':''}>${l}</option>`).join('')+'</optgroup>',
    '<optgroup label="Towns">'+`<option value="__towns"${F.loc==='__towns'?' selected':''}>all towns</option>`+
      TOWNS.map(l=>`<option${F.loc===l?' selected':''}>${l}</option>`).join('')+'</optgroup>'].join('');

  const typeOpts = ['<option value="">All bonuses</option>'].concat(
    TYPES.filter(t=>FAVORS.some(f=>f.type===t.key))
         .map(t=>`<option value="${esc(t.key)}"${F.type===t.key?' selected':''}>${esc(t.ua)}</option>`)).join('');

  const bar = `
    <div class="filters">
      ${showMatrix ? '' : `<select id="f-loc">${locOpts}</select>
      <select id="f-type">${typeOpts}</select>`}
      <select id="f-tier">
        <option value="">Any rarity</option>
        <option value="2"${F.tier==='2'?' selected':''}>Rare</option>
        <option value="1"${F.tier==='1'?' selected':''}>Uncommon</option>
        <option value="0"${F.tier==='0'?' selected':''}>Common</option>
      </select>
      <input type="text" id="f-q" placeholder="search" value="${esc(F.q)}" style="max-width:160px">
      <span class="count">${shown} of ${total}</span>
    </div>`;

  $('#main').innerHTML = bar + (showMatrix ? matrixHTML(list) : listHTML(list));
  $('#foot-left').textContent = showMatrix
    ? 'Matrix: count and best value' + ((F.tier!=='' || F.q) ? ' · filtered' : '')
    : `${list.length} distinct entries`;

  if($('#f-loc')) $('#f-loc').onchange = e=>{F.loc=e.target.value; renderMain();};
  if($('#f-type')) $('#f-type').onchange = e=>{F.type=e.target.value; renderMain();};
  $('#f-tier').onchange = e=>{F.tier=e.target.value; renderMain();};
  $('#f-q').oninput = e=>{
    F.q=e.target.value; renderMain();
    const q=$('#f-q'); q.focus(); q.setSelectionRange(q.value.length,q.value.length);
  };

  $('#main').querySelectorAll('[data-k]').forEach(el=>{
    el.onclick = ()=>{
      const f = FAVORS.find(x=>x.type+'|'+x.value+'|'+x.location===el.dataset.k);
      if(f) addToPlan(f);
    };
  });
}
function listHTML(list){
  if(!list.length) return `<div class="state"><h2>Nothing matches</h2><p>Try clearing the filters.</p></div>`;
  const byType = new Map();
  for(const f of list){ if(!byType.has(f.type)) byType.set(f.type,[]); byType.get(f.type).push(f); }
  const order = TYPES.map(t=>t.key).filter(k=>byType.has(k));
  return order.map(k=>{
    const t = TMAP[k];
    const items = byType.get(k).sort((a,b)=> b.tier-a.tier || a.location.localeCompare(b.location));
    const n = items.reduce((s,f)=>s+f.count,0);
    return `<div class="group">
      <h3><img src="${ICONS[t.icon]||''}" alt="" style="width:20px;height:auto;image-rendering:pixelated">
        <span style="color:var(--paper)">${esc(t.label||k)}</span>
        <span class="n">${n}</span></h3>
      ${items.map(rowHTML).join('')}
    </div>`;
  }).join('');
}
function rowHTML(f){
  const cat = LOCCAT[f.location]||'dungeon';
  const dead = blockedBy(f.location);
  const stack = stacksWith(f);
  const planned = plannedCount(favKey(f));
  const tiers = TMAP[f.type] ? TMAP[f.type].tiers.join('/')+'%' : '?';
  const odd = f.exact ? ''
    : !f.raw ? `<span class="note">no value came from the sheet for this row</span>`
    : `<span class="note">sheet value "${esc(f.raw)}" is not a wiki tier (${esc(tiers)})</span>`;
  const note = odd ? odd
            : dead ? `<span class="note">${dead} — cannot activate</span>`
            : stack ? '<span class="note" style="color:var(--ok)">stacks with the weekly bonus</span>' : '';
  return `<div class="row${dead?' dead':''}${stack?' stacked':''}" data-k="${esc(f.type+'|'+f.value+'|'+f.location)}" title="${esc(TIERNAME[f.tier])}">
    <img src="${ICONS[f.meta?f.meta.icon:'slayer']||''}" alt="">
    <span class="main">
      <span class="loc" style="color:${CATCOLOR[cat]}">${esc(f.location)}</span>${weeklyBadges(f.location)}
      <span class="val">${esc(f.value)}</span> ${note}
    </span>
    <span class="pips" title="${esc(TIERNAME[f.tier])}">
      ${[0,1,2].map(i=>`<span class="pip${i<=f.tier?' on':''}"></span>`).join('')}
    </span>
    <span class="qty">×${f.count}${planned?`<small>${planned} planned</small>`:''}</span>
    <button class="add">add to plan</button>
  </div>`;
}
function matrixHTML(list){
  const data = list || FAVORS;
  const locs = ['Everywhere','Wilderness',...DUNGEONS,'Ocean',...TOWNS];
  const rows = TYPES.filter(t=>data.some(f=>f.type===t.key));
  if(!rows.length) return `<div class="state"><h2>Nothing matches</h2><p>Try clearing the filters.</p></div>`;
  const cell = (t,l)=>{
    const fs = data.filter(f=>f.type===t.key && f.location===l);
    if(!fs.length) return '<td class="empty">·</td>';
    const n = fs.reduce((s,f)=>s+f.count,0);
    const best = fs.reduce((a,b)=> b.num>a.num?b:a);
    const dead = blockedBy(l);
    const k = esc(best.type+'|'+best.value+'|'+best.location);
    return `<td class="has cell${dead?' dead':''}${fs.some(f=>!f.exact)?' odd':''}" data-k="${k}"
      title="${esc(l)} · ${esc(t.ua)} ${esc(best.value)} (${TIERNAME[best.tier]}) — add to plan">
      ${n}<br><span class="b">${esc(best.value)}</span></td>`;
  };
  return `<div class="matrix-wrap"><table>
    <thead><tr><th class="rowhead">Bonus</th>${locs.map(l=>{
      const c=CATCOLOR[LOCCAT[l]||'dungeon'];
      const b = weeklyBadges(l);
      return `<th style="color:${c}">${esc(l)}${b?'<br>'+b:''}</th>`;
    }).join('')}</tr></thead>
    <tbody>${rows.map(t=>`<tr><td class="rowhead">${esc(t.ua)}</td>${locs.map(l=>cell(t,l)).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}

/* ---------- render ---------- */
function render(){
  $('#stamp-date').textContent = STAMP;
  $('#stamp-total').textContent = FAVORS.reduce((s,f)=>s+f.count,0);
  renderWeekly(); renderWeek(); renderMain();
}

/* ---------- start ---------- */
loadHash();
renderWeekly(); renderSociety(); renderWeek();
$('#copy-plan').onclick = copyPlan;
$('#clear-plan').onclick = ()=>{ if(!planTotal()) return; WEEK=DAYS.map(()=>[]); saveHash(); render(); toast('Week cleared'); };
$('#reload').onclick = load;
$('#diag').onclick = ()=>{
  if(!RAW_SAMPLE) return toast('Nothing loaded yet');
  const {head,idx,rows} = RAW_SAMPLE;
  $('#main').innerHTML = `<div class="state" style="text-align:left">
    <h2>What the sheet returned</h2>
    <p>Header: <code>${esc(JSON.stringify(head))}</code></p>
    <p>Column indexes in use: <code>${esc(JSON.stringify(idx))}</code></p>
    <p>First rows, exactly as received:</p>
    <textarea readonly>${esc(rows.map(r=>JSON.stringify(r)).join('\n'))}</textarea>
    <button class="btn" style="max-width:200px;margin:10px 0" id="diag-back">Back</button></div>`;
  $('#diag-back').onclick = renderMain;
};
$('#toggle-matrix').onclick = ()=>{
  showMatrix=!showMatrix;
  $('#toggle-matrix').textContent = showMatrix ? 'Show list' : 'Show matrix';
  renderMain();
};
load();
</script>
</body>
</html>
